name: listen_then_task
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.3.0
  googleapis: ^13.0.0
  vosk_flutter: ^0.3.48
  http: ^0.13.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/models/

dependency_overrides:
  # vosk_flutter pins an old permission_handler that uses Flutter's removed
  # v1 plugin embedding APIs. permission_handler's public API used by
  # vosk_flutter (Permission.microphone) is stable across this bump.
  permission_handler: ^12.0.0
